name: Build Tauri App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (no bundle - just the .exe)
        run: pnpm tauri build --bundles none

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdreader-windows-exe
          path: src-tauri/target/release/mdreader.exe
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdreader-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
          retention-days: 7

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdreader-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
